<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analyzier – BFE 5522814</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#20201e; --text:#ececea; --muted:#9a9a94; --line:#33332f; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:grid; grid-template-columns: 320px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:16px; overflow:auto; }
  h1 { font-size:16px; margin:0 0 4px; } h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em;
       color:var(--muted); margin:18px 0 8px; }
  .muted { color:var(--muted); font-size:12px; }
  label { display:flex; gap:8px; align-items:center; padding:3px 0; cursor:pointer; }
  table { width:100%; border-collapse:collapse; font-variant-numeric: tabular-nums; }
  td { padding:3px 0; border-bottom:1px solid var(--line); } td.n { text-align:right; }
  .sw { display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  #map { height:100vh; background:#000; }
  ul { padding-left:18px; margin:4px 0; } li { margin:2px 0; }
  input[type=range] { width:100%; }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: auto 70vh; height:auto; }
    #map { height:70vh; } }
</style>
</head>
<body>
<aside>
  <h1>Analyzier – BFE 5522814</h1>
  <div class="muted" id="meta"></div>
  <h2>Baggrund</h2><div id="bases"></div>
  <h2>Lag</h2><div id="overlays"></div>
  <label class="muted">Gennemsigtighed for lag</label>
  <input type="range" id="opacity" min="0" max="100" value="60">
  <h2>Arealer</h2><table id="areas"></table>
  <h2>Kilder</h2><ul id="sources" class="muted"></ul>
  <h2>Evaluering</h2>
  <div class="muted">Udfyld <code>evaluering.md</code> i run-mappen.</div>
</aside>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const D = {"width": 400, "height": 400, "res": 1.0, "layers": [{"navn": "Sentinel-2 sommer (median)", "fil": "output/lag/sentinel2.png", "type": "base"}, {"navn": "Sentinel-2 NDVI", "fil": "output/lag/sentinel2_ndvi.png", "type": "overlay"}, {"navn": "ESA WorldCover", "fil": "output/lag/worldcover.png", "type": "overlay"}, {"navn": "Resultat: arealtyper", "fil": "output/lag/klasser.png", "type": "overlay", "vis": true}], "areas": {"Belægning": 5815.0, "Græs": 50161.0, "Buske": 0.0, "Træer": 104024.0, "Bygning": 0.0, "Ukendt": 0.0, "Udeareal i alt": 160000.0}, "legend": [{"navn": "Belægning", "farve": "#9e9e9e"}, {"navn": "Græs", "farve": "#8bcd50"}, {"navn": "Buske", "farve": "#2e8b57"}, {"navn": "Træer", "farve": "#105220"}, {"navn": "Bygning", "farve": "#c8463c"}, {"navn": "Ukendt", "farve": "#f0c828"}], "run": {"run": "2026-10-07_1153_bfe-5522814", "tidspunkt": "2026-10-07T11:53:59", "analyzier_version": "0.1.0", "git_commit": null, "bfe": "5522814", "omraade": "firkant 400x400 m omkring 558376,6369071 (matrikel ikke hentet)", "grid": {"crs": "EPSG:25832", "bbox": [558176.0, 6368871.0, 558576.0, 6369271.0], "opløsning_m": 1.0, "pixels": [400, 400]}, "metode": "sentinel2", "parametre": {"ndvi_vegetation": 0.45, "median_filter_px": 3}, "note": "Første run uden nøgler: Sentinel-2 + WorldCover + OSM", "kilder": [{"navn": "Datafordeler MAT: jordstykker for BFE 5522814", "status": "sprunget over", "note": "DATAFORDELER_API_KEY eller DATAFORDELER_MAT_VERSION mangler i .env"}, {"navn": "OpenStreetMap (Overpass)", "status": "sprunget over", "note": "Overpass: HTTP 504"}, {"navn": "Dataforsyningen (ortofoto + DHM)", "status": "sprunget over", "note": "DATAFORSYNINGEN_TOKEN mangler i .env. Hovedkilderne er derfor ikke med"}, {"navn": "Sentinel-2 L2A (Earth Search, AWS)", "status": "ok", "scener": [{"id": "S2A_32VNJ_20250818_0_L2A", "dato": "2025-08-18", "skydække_%": 0.013397}, {"id": "S2B_32VNJ_20240627_0_L2A", "dato": "2024-06-27", "skydække_%": 0.070049}, {"id": "S2C_32VNJ_20250630_0_L2A", "dato": "2025-06-30", "skydække_%": 0.116144}, {"id": "S2A_32VNJ_20240625_0_L2A", "dato": "2024-06-25", "skydække_%": 0.553893}]}, {"navn": "ESA WorldCover 2021 (10 m)", "status": "ok"}, {"navn": "Copernicus Data Space (øvrige lag)", "status": "sprunget over", "note": "CDSE_CLIENT_ID/SECRET mangler i .env. Kun Sentinel-2 hentet via Earth Search"}], "argumenter": {"bfe": "5522814", "center": "558376,6369071", "size": 400.0, "orto_years": "2025,2024,2023", "s2_years": "2025,2024", "note": "Første run uden nøgler: Sentinel-2 + WorldCover + OSM"}}};
const bounds = [[0, 0], [D.height, D.width]];
const map = L.map('map', { crs: L.CRS.Simple, minZoom: -4, maxZoom: 4, zoomSnap: 0.25 });
map.fitBounds(bounds);
let opacity = 0.6;
const overlays = [];
let base = null;
const basesEl = document.getElementById('bases'), ovEl = document.getElementById('overlays');
D.layers.forEach((l, i) => {
  const layer = L.imageOverlay(l.fil, bounds, { opacity: l.type === 'base' ? 1 : opacity });
  const lab = document.createElement('label');
  const inp = document.createElement('input');
  if (l.type === 'base') {
    inp.type = 'radio'; inp.name = 'base';
    if (!base) { inp.checked = true; base = layer; layer.addTo(map); }
    inp.onchange = () => { if (base) map.removeLayer(base); base = layer; layer.addTo(map); layer.bringToBack(); };
    lab.append(inp, l.navn); basesEl.append(lab);
  } else {
    inp.type = 'checkbox'; inp.checked = !!l.vis;
    if (l.vis) layer.addTo(map);
    inp.onchange = () => inp.checked ? layer.addTo(map) : map.removeLayer(layer);
    overlays.push(layer); lab.append(inp, l.navn); ovEl.append(lab);
  }
});
document.getElementById('opacity').oninput = e => { opacity = e.target.value / 100; overlays.forEach(o => o.setOpacity(opacity)); };
const colors = Object.fromEntries(D.legend.map(x => [x.navn, x.farve]));
const tb = document.getElementById('areas');
for (const [k, v] of Object.entries(D.areas)) {
  const sw = colors[k] ? `<span class="sw" style="background:${colors[k]}"></span>` : '';
  tb.insertAdjacentHTML('beforeend', `<tr><td>${sw}${k}</td><td class="n">${v.toLocaleString('da-DK')} m²</td></tr>`);
}
document.getElementById('meta').textContent = `${D.run.run} · metode ${D.run.metode} · ${D.res} m/px`;
const src = document.getElementById('sources');
for (const s of D.run.kilder) {
  const li = document.createElement('li');
  li.textContent = `${s.status === 'ok' ? '✓' : '✗'} ${s.navn}${s.note ? ' – ' + s.note : ''}`;
  src.append(li);
}
</script>
</body>
</html>
